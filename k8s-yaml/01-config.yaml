apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  namespace: shortener
data:
  BASE_URL: "http://localhost:8080"
  REDIS_URL: "redis://cache:6379/0"
  DB_HOST: "db"
  DB_NAME: "shortener"
  DB_USER: "app"
---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: shortener
type: Opaque
stringData:
  POSTGRES_PASSWORD: change-me
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-init
  namespace: shortener
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS links (
        code        VARCHAR(10) PRIMARY KEY,
        target_url  TEXT        NOT NULL,
        hits        BIGINT      NOT NULL DEFAULT 0,
        created_at  TIMESTAMPTZ NOT NULL DEFAULT now()
    );
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: shortener
data:
  redis.conf: |
    maxmemory 64mb
    maxmemory-policy allkeys-lru
    save ""
    appendonly no
